"Constitución": >-
  La siguiente selección de piezas tiene relación con la temática de Constitución, abordando distintos
  momentos de la historia política chilena en que se ha debatido sobre las bases institucionales del
  país. Comprende referencias a la Constitución de 1980, establecida durante la dictadura militar, y a
  las demandas posteriores por su reforma o reemplazo. Asimismo, incluye expresiones vinculadas al
  proceso constituyente impulsado durante el segundo gobierno de Michelle Bachelet y a los procesos
  desarrollados a partir del estallido social de 2019. Estas piezas permiten reconocer diferentes
  posiciones, demandas y disputas en torno a la legitimidad constitucional, la participación ciudadana y
  la construcción de un nuevo marco institucional.

"Plebiscito": >-
  La siguiente selección de piezas tiene relación con la temática de Plebiscito, reuniendo expresiones
  gráficas asociadas a distintas consultas populares que han marcado la historia política reciente de
  Chile. Entre ellas se encuentran el plebiscito de 1980, mediante el cual se sometió a votación la
  Constitución elaborada durante la dictadura militar, y el de 1988, que definió la continuidad de
  Augusto Pinochet en el poder y abrió paso al retorno a la democracia. La selección también aborda los
  plebiscitos vinculados a los procesos constituyentes posteriores al estallido social de 2019,
  incluyendo las votaciones de 2020, 2022 y 2023. En conjunto, estas piezas reflejan campañas,
  posicionamientos y disputas políticas desarrolladas en torno a estos procesos de decisión ciudadana.

"Movimiento Nacionalista": >-
  La siguiente selección de piezas tiene relación con la temática de Movimiento Nacionalista,
  comprendiendo expresiones gráficas vinculadas a grupos, organizaciones y colectivos de carácter
  ultraconservador que articulan sus discursos políticos en torno al patriotismo y la defensa de la
  nación. Estas posiciones suelen apelar a la preservación de determinados valores tradicionales,
  concepciones de identidad nacional y principios de orden social y político. Las piezas agrupadas bajo
  esta categoría permiten aproximarse a las formas de representación, los símbolos y los discursos
  mediante los cuales estos sectores han expresado sus posiciones e intervenido en el debate público
  chileno.
