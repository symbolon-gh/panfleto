<div class="card mb-3"><div class="card-body">
  <{{ include.heading_level | default: 'h2' | strip }} class="card-title h5">Descripción</{{ include.heading_level | default: 'h2' | strip }}>
  <p class="card-text">{{ site.description }}</p>
  {%- assign about = site.data.config-nav | where: 'stub','/about.html' | size -%}
  {% if about > 0 %}<a class="btn btn-{{ include.btn-color | default: 'primary' }}" href="{{ '/about.html' | relative_url }}">Conocer más &raquo;</a>{% endif %}
</div></div>
