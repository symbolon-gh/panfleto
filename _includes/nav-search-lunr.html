{% comment %}
    Buscador del menú principal.
{%- endcomment -%}
<form role="search" id="nav-search" action="{{ '/search/index.html' | relative_url }}">
    <input id="nav-search-box" class="form-control" type="search" placeholder="{% if page.lang == 'en' %}Search{% elsif page.lang == 'fr' %}Rechercher{% else %}Buscar{% endif %}" aria-label="{% if page.lang == 'en' %}Search the collection{% elsif page.lang == 'fr' %}Rechercher dans la collection{% else %}Buscar en la colección{% endif %}" name="q">
</form>
