<button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#advancedSearchModal">Búsqueda avanzada</button>
<div class="modal fade" id="advancedSearchModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h1 class="modal-title h4" id="advancedSearchModalLabel">Búsqueda avanzada</h1><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body"><form id="advancedSearchForm"><div id="searchRows"></div>
      <div class="mt-3"><button type="button" class="btn btn-outline-secondary btn-sm" onclick="addSearchRow()">Añadir otro campo</button></div>
    </form></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="button" class="btn btn-primary" onclick="submitAdvancedSearch()">Buscar</button></div>
  </div></div>
</div>
<template id="searchRowTemplate">
  <div class="search-row mb-4"><div class="row align-items-center">
    <div class="col-4 col-md-2"><select class="form-select form-select-sm boolean-operator" aria-label="Operador booleano">
      <option value="AND">Y</option><option value="OR">O</option><option value="NOT">NO</option>
    </select></div>
    <div class="col-5 col-md-3"><select class="form-select form-select-sm field-select" aria-label="Campo de metadatos">
      <option value="all">Todos los campos</option><option value="title">Título</option>
      {% for f in site.data.config-browse %}{% assign cap-field = f.field | capitalize %}<option value="{{ f.field }}">{{ f.facet_name | default: f.display_name | default: cap-field }}</option>{% endfor %}
    </select></div>
    <div class="col-10 col-md-6"><input type="text" class="form-control form-control-sm search-input" aria-label="Texto buscado" placeholder="Ingresa un término">
      <div class="date-range-inputs"><div class="date-input-group"><input type="text" class="form-control form-control-sm start-date" aria-label="Desde" placeholder="Desde"><span class="date-separator">a</span><input type="text" class="form-control form-control-sm end-date" aria-label="Hasta" placeholder="Hasta"></div></div>
    </div>
    <div class="col-2 col-md-1"><button type="button" class="btn btn-outline-danger btn-sm remove-row" aria-label="Quitar condición"><span aria-hidden="true">&times;</span></button></div>
  </div></div>
</template>
